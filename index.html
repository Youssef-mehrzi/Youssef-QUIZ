        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(140, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.type = 'triangle'; o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + idx * 0.1 + 0.25);
                        o.start(audioCtx.currentTime + idx * 0.1);
                        o.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
                    });
                }
            } catch (e) { console.log("Audio play error:", e); }
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('currentLangLabel').innerText = lang === 'tn' ? 'Tounsi' : lang === 'ar' ? 'العربية' : lang === 'en' ? 'English' : 'Français';
            document.getElementById('langMenu').classList.add('hidden');
            
            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
            }

            const t = i18n[lang];
            document.getElementById('appName').innerText = t.appName;
            document.getElementById('startTitle').innerText = t.startTitle;
            document.getElementById('startSubtitle').innerText = t.startSubtitle;
            document.getElementById('nameLabel').innerText = t.nameLabel;
            document.getElementById('playerNameInput').placeholder = t.namePlaceholder;
            document.getElementById('startBtn').innerText = t.startBtn;
            document.getElementById('retryBtn').innerText = t.retryBtn;
            document.getElementById('resultTitle').innerText = t.resultTitle;

            if (playerName) {
                document.getElementById('playerTag').innerText = t.playerTag + playerName;
            }
            if (currentQuestion < questionsData.length && !document.getElementById('quizScreen').classList.contains('hidden')) {
                renderQuestion();
            }
        }

        function toggleLangDropdown() {
            playSound('click');
            document.getElementById('langMenu').classList.toggle('hidden');
        }

        function validateAndStart() {
            playSound('click');
            const input = document.getElementById('playerNameInput');
            const nameVal = input.value.trim();
            if (!nameVal) {
                input.classList.add('border-red-500', 'ring-2', 'ring-red-500/50');
                setTimeout(() => input.classList.remove('border-red-500', 'ring-2', 'ring-red-500/50'), 1500);
                return;
            }
            playerName = nameVal;
            score = 0;
            currentQuestion = 0;
            userAnswers = [];

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            
            document.getElementById('playerTag').innerText = i18n[currentLang].playerTag + playerName;
            buildPaginationPills();
            renderQuestion();
        }

        function buildPaginationPills() {
            const container = document.getElementById('paginationPills');
            container.innerHTML = '';
            for (let i = 0; i < questionsData.length; i++) {
                const pill = document.createElement('div');
                pill.id = `pill-${i}`;
                pill.className = `w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs transition-all ${
                    i === currentQuestion ? 'bg-sky-500 text-white shadow-lg scale-110 border border-white/30' : 'bg-slate-800 text-slate-400 border border-slate-700'
                }`;
                pill.innerText = i + 1;
                container.appendChild(pill);
            }
        }

        function updatePaginationUI() {
            for (let i = 0; i < questionsData.length; i++) {
                const pill = document.getElementById(`pill-${i}`);
                if (!pill) continue;
                if (i === currentQuestion) {
                    pill.className = 'w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs bg-sky-500 text-white shadow-lg scale-110 border border-white/30 transition-all';
                } else if (userAnswers[i] !== undefined) {
                    const isCorrect = userAnswers[i] === questionsData[i].correct;
                    pill.className = `w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs text-white transition-all ${isCorrect ? 'bg-emerald-600/80 border border-emerald-400' : 'bg-rose-600/80 border border-rose-400'}`;
                } else {
                    pill.className = 'w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all';
                }
            }
        }

        function renderQuestion() {
            const qData = questionsData[currentQuestion];
            const t = i18n[currentLang];

            document.getElementById('qBadge').innerText = t.qBadge + ` ${currentQuestion + 1} / ${questionsData.length}`;
            document.getElementById('questionText').innerText = qData.q[currentLang] || qData.q.tn;

            document.getElementById('optAText').innerText = qData.optA[currentLang] || qData.optA.tn;
            document.getElementById('optAImg').src = qData.optA.img;

            document.getElementById('optBText').innerText = qData.optB[currentLang] || qData.optB.tn;
            document.getElementById('optBImg').src = qData.optB.img;

            updatePaginationUI();
        }

        function handleAnswer(choice) {
            playSound('click');
            const qData = questionsData[currentQuestion];
            const isCorrect = (choice === qData.correct);

            userAnswers[currentQuestion] = choice;

            if (isCorrect) {
                playSound('correct');
                score++;
            } else {
                playSound('wrong');
            }

            currentQuestion++;
            if (currentQuestion < questionsData.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');

            document.getElementById('scoreText').innerText = `${score} / ${questionsData.length}`;
            document.getElementById('resultGreeting').innerText = `Bravo ${playerName}!`;

            const msgBox = document.getElementById('resultMessageBox');
            const msgEl = document.getElementById('resultMessage');
            const t = i18n[currentLang];

            if (score === questionsData.length) {
                playSound('win');
                msgBox.className = 'my-6 p-5 rounded-2xl border bg-emerald-950/60 border-emerald-500/50 text-emerald-300 text-lg md:text-xl font-black font-adapt transition-all shadow-inner leading-relaxed';
                msgEl.innerText = t.perfectMsg;
                
                confetti({
                    particleCount: 150,
                    spread: 90,
                    origin: { y: 0.6 }
                });
            } else {
                playSound('wrong');
                msgBox.className = 'my-6 p-5 rounded-2xl border bg-rose-950/60 border-rose-500/50 text-rose-300 text-lg md:text-xl font-black font-adapt transition-all shadow-inner leading-relaxed';
                msgEl.innerText = t.failMsg;
            }

            saveResultToServer({
                name: playerName,
                score: score,
                totalQuestions: questionsData.length,
                answers: userAnswers.map((ans, idx) => ({
                    questionNumber: idx + 1,
                    choice: ans,
                    correct: ans === questionsData[idx].correct
                }))
            });
        }

        async function saveResultToServer(data) {
            try {
                await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.log("Could not save to server:", e);
            }
        }

        function restartQuiz() {
            playSound('click');
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('playerNameInput').value = '';
            playerName = '';
            currentQuestion = 0;
            score = 0;
            userAnswers = [];
        }
    </script>
